<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bodega · Control de vinos</title>
  <style>
    :root{--ink:#25291f;--muted:#68705d;--cream:#f3f0e7;--paper:#fbfaf5;--wine:#657153;--wine2:#3f4933;--gold:#c3aa7a;--line:#ddd8c8;--ok:#4f6445;--shadow:0 16px 45px rgba(46,55,37,.13)}
    *{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
    button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{min-height:100vh}.top{background:linear-gradient(120deg,var(--wine2),var(--wine));color:white;padding:26px clamp(18px,4vw,58px) 34px;position:relative;overflow:hidden}.top h1{font:500 clamp(36px,6vw,64px)/1 Georgia,serif;letter-spacing:.08em;margin:25px 0 8px}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:22px}.btn{border:1px solid transparent;border-radius:12px;padding:10px 15px;font-weight:750;display:inline-flex;align-items:center;gap:7px}.btn-primary{background:var(--gold);color:#21170b}.btn-light{background:#ffffff14;color:white;border-color:#ffffff30}.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}.btn-wine{background:var(--wine);color:white}.main{padding:0 clamp(14px,4vw,58px) 50px;margin-top:-1px}.toolbar{background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px;padding:14px;display:grid;grid-template-columns:minmax(220px,1fr) auto;gap:10px;position:sticky;top:10px;z-index:5}.search{position:relative}.search input{width:100%;height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 14px 0 42px;outline:none}.search span{position:absolute;left:15px;top:11px;color:var(--muted)}select{height:44px;border:1px solid var(--line);border-radius:12px;background:white;padding:0 34px 0 12px;color:var(--ink)}.tabs{display:flex;gap:8px;margin:22px 0 8px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:#eee7df;color:var(--muted);padding:9px 15px;border-radius:999px;font-weight:800}.tab.active{background:var(--wine);color:white;border-color:var(--wine)}.type-tabs{margin-top:10px}.type-tab{border:1px solid var(--line);background:var(--paper);color:var(--wine2);padding:8px 14px;border-radius:999px;font-weight:800}.type-tab.active{background:var(--wine);border-color:var(--wine);color:white}.summary{display:flex;justify-content:space-between;align-items:center;color:var(--muted);margin:12px 2px 20px}.group{margin:26px 0 36px}.group-title{display:flex;align-items:center;gap:12px;margin-bottom:14px}.group-title h2{font:500 25px/1.2 Georgia,serif;margin:0}.count{background:#dfe4d5;color:#46503b;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:800}.origin{margin:18px 0 10px;color:var(--wine);font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}.card{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:0 5px 18px #2e37250a;display:flex;flex-direction:column;min-height:210px;transition:.2s}.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.card-head{display:flex;justify-content:space-between;gap:12px}.badge{font-size:11px;text-transform:uppercase;letter-spacing:.09em;font-weight:850;color:var(--wine)}.ref{color:var(--muted);font-size:12px}.card h3{font:500 21px/1.22 Georgia,serif;margin:7px 0 4px}.area{color:var(--muted);min-height:23px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.tag{background:#e5e9dd;padding:4px 8px;border-radius:8px;font-size:12px}.money{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:auto;border-top:1px solid var(--line);padding-top:13px}.metric small{display:block;color:var(--muted);font-size:10px}.metric strong{display:block;font-size:14px}.card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:13px}.location{font-size:12px;color:var(--muted)}.edit{border:0;background:#e3e8dc;color:var(--wine2);border-radius:9px;padding:7px 10px;font-weight:800}.empty{text-align:center;padding:70px 20px;color:var(--muted)}.loader{padding:80px;text-align:center;color:var(--muted)}
    dialog{border:0;border-radius:20px;padding:0;width:min(760px,calc(100% - 22px));max-height:92vh;box-shadow:0 30px 90px #21091466;background:var(--paper)}dialog::backdrop{background:#1c1210a6;backdrop-filter:blur(3px)}.modal-head{position:sticky;top:0;background:var(--paper);z-index:2;display:flex;justify-content:space-between;align-items:center;padding:20px 22px;border-bottom:1px solid var(--line)}.modal-head h2{font:500 26px Georgia,serif;margin:0}.close{border:0;background:#eee7df;border-radius:50%;width:35px;height:35px;font-size:20px}.form{padding:20px 22px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:850;color:#5f534b}.field input,.field textarea,.field select{width:100%;border:1px solid #dcd0c5;border-radius:11px;background:white;padding:10px 11px;outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--wine);box-shadow:0 0 0 3px #6f173512}.field textarea{min-height:88px;resize:vertical}.readonly{background:#eee9e3!important;color:#756a63}.modal-foot{position:sticky;bottom:0;background:var(--paper);padding:15px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}.toast{position:fixed;right:18px;bottom:18px;z-index:20;background:#20201e;color:white;border-radius:12px;padding:12px 16px;box-shadow:var(--shadow);transform:translateY(100px);opacity:0;transition:.25s}.toast.show{transform:none;opacity:1}.toast.error{background:#8b1f35}
    @media(max-width:720px){.toolbar{grid-template-columns:1fr 1fr}.search{grid-column:1/-1}.toolbar .btn{justify-content:center}.fields{grid-template-columns:1fr}.top{padding-bottom:25px}.main{padding-inline:11px}.money{grid-template-columns:1fr 1fr 1fr}}
      .brand-row{display:flex;align-items:center;justify-content:space-between;gap:20px}.brand-logo{width:min(192px,42vw);height:auto}.session{display:flex;align-items:center;gap:9px;color:#eef1e8;font-size:13px}.session button{border:1px solid #ffffff55;background:#ffffff12;color:white;border-radius:9px;padding:6px 9px}.location-top{min-height:18px;color:var(--wine);font-size:11px;font-weight:900;letter-spacing:.11em;text-transform:uppercase}.description{color:#4d5347;font-size:13px;margin:7px 0}.audit{color:var(--muted);font-size:10px}.login-box{padding:28px}.login-box h2{font:500 30px Georgia,serif;margin:8px 0}.login-box p{color:var(--muted)}.login-box input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;margin:13px 0 16px}.hidden{display:none!important}
  </style>
</head>
<body><div class="shell" id="app" hidden>
  <header class="top"><div class="brand-row"><img class="brand-logo" src="logo.svg" alt="Jara · Kimpton Los Monteros"><div class="session"><span id="sessionName"></span><button id="logoutBtn">Cerrar sesión</button></div></div><h1>MASTER LIST</h1><div class="actions"><button class="btn btn-primary" id="newBtn">＋ Nuevo vino</button><button class="btn btn-light" id="refreshBtn">↻ Actualizar</button></div></header>
  <main class="main">
    <div class="toolbar"><div class="search"><span>⌕</span><input id="search" type="search" placeholder="Buscar por nombre, referencia, D.O., uva…" autocomplete="off"></div><select id="originFilter"><option value="">Todos los orígenes</option></select></div>
    <div class="tabs"><button class="tab active" data-section="on">En carta</button><button class="tab" data-section="off">No en carta</button></div>
    <div class="tabs type-tabs" id="typeButtons"></div>
    <div class="summary"><span id="resultCount">Cargando…</span><span id="updated"></span></div><section id="content" class="loader">Cargando bodega…</section>
  </main>
</div>
<dialog id="modal"><form id="wineForm" class="form"><div class="modal-head"><div><div class="eyebrow" style="color:var(--wine)" id="modalEyebrow">EN CARTA</div><h2 id="modalTitle">Nuevo vino</h2></div><button type="button" class="close" id="closeBtn" aria-label="Cerrar">×</button></div><div id="fields" class="fields"></div><div class="modal-foot"><button type="button" class="btn btn-ghost" id="cancelBtn">Cancelar</button><button type="submit" class="btn btn-wine" id="saveBtn">Guardar cambios</button></div></form></dialog>
<dialog id="loginModal"><form id="loginForm" class="login-box"><div class="eyebrow" style="color:var(--wine)">JARA · BODEGA</div><h2>Identificación</h2><p>Introduce tu nombre para continuar.</p><input id="staffInput" maxlength="120" autocomplete="name" placeholder="Nombre del empleado"><button class="btn btn-wine" type="submit" style="width:100%;justify-content:center">Entrar</button></form></dialog><div id="toast" class="toast"></div>
<datalist id="typesOn"><option>Generoso</option><option>Espumoso</option><option>Tinto</option><option>Blanco</option><option>Rosado</option><option>Por copas</option><option>Magnum</option></datalist>
<datalist id="countries"><option>España</option><option>Francia</option><option>Italia</option><option>Portugal</option><option>Alemania</option><option>Argentina</option><option>Chile</option><option>Estados Unidos</option><option>Nueva Zelanda</option><option>Sudáfrica</option></datalist>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbwxqKihM28GDi1vaX5b_3J_XTUqKHmBWfkMgWnDs9CjnSwRBY4XE-B4YP2tJAZHJZUtNA/exec';
const state={data:{on:[],off:[]},section:'on',editing:null,generatedAt:null,staff:'',typeFilter:''};
const schemas={
 on:[['type','Tipo','text',1],['origin','Origen / País','text',1],['reference','Referencia','text',1],['name','Nombre','text',1],['vintage','Añada','text'],['area','D.O. / Zona','text'],['grapes','Uvas','text'],['tasting','Notas de cata','textarea'],['cost','Coste por botella','number'],['price','PVP Carta','number'],['profit','Beneficio por botella','text',0,1],['marginCost','Margen s/coste','text',0,1],['marginSale','Margen s/venta','text',0,1],['location','Localización','text'],['notes','Notas','textarea']],
 off:[['type','Categoría','text',1],['reference','Referencia','text',1],['name','Nombre','text',1],['area','D.O. / Zona','text'],['cost','Precio de coste','number'],['notes','Notas','textarea']]
};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const norm=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const money=v=>{if(v===''||v==null)return '—';const n=Number(numeric(v));return Number.isFinite(n)?new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(n):v};
const displayMargin=v=>{if(v===''||v==null)return '—';const s=String(v);if(s.includes('%'))return s;const n=Number(s.replace(',','.'));return Number.isFinite(n)?new Intl.NumberFormat('es-ES',{style:'percent',maximumFractionDigits:1}).format(n):s};
function canonicalType(v){const n=norm(v);if(n==='espumosos'||n==='sparkling'||n==='champagne')return 'Espumoso';if(n==='tintos'||n==='red')return 'Tinto';if(n==='blancos'||n==='white')return 'Blanco';if(n==='rosados'||n==='rose')return 'Rosado';if(n==='dessert')return 'Generoso';if(n==='magnums')return 'Magnum';return v||''}
function inferOrigin(w){if(w.origin)return w.origin;const t=norm((w.area||'')+' '+(w.name||''));if(/champagne|bordeaux|bourgogne|chablis|rhone|loire|sancerre|pouilly|francia|france/.test(t))return 'Francia';if(/rioja|ribera|rueda|rías|rias|jerez|cava|priorat|málaga|malaga|montilla|rias baixas|bierzo|jumilla|toro|penedès|penedes|españa|spain/.test(t))return 'España';if(/chianti|barolo|barbaresco|prosecco|italia|italy/.test(t))return 'Italia';if(/douro|vinho verde|portugal|porto/.test(t))return 'Portugal';return ''}
function jsonp(){return new Promise((resolve,reject)=>{if(API_URL.startsWith('PEGUE_'))return reject(new Error('Falta configurar API_URL en index.html'));const cb='wineCallback_'+Date.now()+'_'+Math.random().toString(36).slice(2);const script=document.createElement('script');const timer=setTimeout(()=>finish(new Error('La base de datos tardó demasiado en responder.')),60000);function finish(error,data){clearTimeout(timer);delete window[cb];script.remove();error?reject(error):resolve(data)}window[cb]=data=>data&&data.ok?finish(null,data):finish(new Error(data&&data.error?data.error:'No se pudieron cargar los vinos.'));script.onerror=()=>finish(new Error('No se pudo conectar con Google Apps Script.'));script.src=API_URL+'?callback='+encodeURIComponent(cb)+'&_='+Date.now();document.head.appendChild(script)})}
async function api(method='GET',body){if(method==='GET')return jsonp();if(API_URL.startsWith('PEGUE_'))throw new Error('Falta configurar API_URL');await fetch(API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({...body,staffName:state.staff})});await new Promise(r=>setTimeout(r,1800));return{message:body.action==='create'?'Vino creado.':'Vino actualizado.'}}
async function load(){setLoading(true);try{const p=await api();state.data=p.data;state.generatedAt=p.generatedAt;render();}catch(e){showError(e.message)}finally{setLoading(false)}}
function setLoading(on){$('#refreshBtn').disabled=on;$('#refreshBtn').textContent=on?'Actualizando…':'↻ Actualizar'}
function filtered(){const q=norm($('#search').value),type=state.typeFilter,origin=$('#originFilter').value;return state.data[state.section].filter(w=>{const wt=canonicalType(w.type),wo=inferOrigin(w);const hay=norm(Object.values(w).join(' '));return(!q||hay.includes(q))&&(!type||wt===type)&&(!origin||wo===origin)})}
function updateFilters(){const all=state.data[state.section],currentOrigin=$('#originFilter').value;const types=[...new Set(all.map(w=>canonicalType(w.type)).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));const origins=[...new Set(all.map(inferOrigin).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));if(state.typeFilter&&!types.includes(state.typeFilter))state.typeFilter='';$('#typeButtons').innerHTML='<button class="type-tab'+(!state.typeFilter?' active':'')+'" data-type="">Todos</button>'+types.map(x=>'<button class="type-tab'+(state.typeFilter===x?' active':'')+'" data-type="'+esc(x)+'">'+esc(x)+'</button>').join('');$$('.type-tab').forEach(button=>button.addEventListener('click',()=>{state.typeFilter=button.dataset.type;render()}));$('#originFilter').innerHTML='<option value="">Todos los orígenes</option>'+origins.map(x=>'<option>'+esc(x)+'</option>').join('');if(origins.includes(currentOrigin))$('#originFilter').value=currentOrigin;$('#originFilter').style.display=state.section==='on'?'block':'none'}
function render(){updateFilters();const list=filtered();$('#resultCount').textContent=list.length+' vino'+(list.length===1?'':'s');$('#updated').textContent=state.generatedAt?'Actualizado '+new Date(state.generatedAt).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}):'';if(!list.length){$('#content').className='empty';$('#content').innerHTML='<h3>No hay resultados</h3>';return}$('#content').className='';const byType=groupBy(list,w=>canonicalType(w.type));$('#content').innerHTML=Object.entries(byType).sort(([a],[b])=>(a||'zzz').localeCompare(b||'zzz','es')).map(([type,wines])=>{let inside;if(state.section==='on'){const byOrigin=groupBy(wines,w=>w.origin||inferOrigin(w)||'');inside=Object.entries(byOrigin).sort(([a],[b])=>(a||'zzz').localeCompare(b||'zzz','es')).map(([origin,items])=>(origin?'<div class="origin">'+esc(origin)+'</div>':'')+'<div class="grid">'+items.map(card).join('')+'</div>').join('')}else inside='<div class="grid">'+wines.map(card).join('')+'</div>';return '<div class="group">'+(type?'<div class="group-title"><h2>'+esc(type)+'</h2><span class="count">'+wines.length+'</span></div>':'')+inside+'</div>'}).join('');$$('.edit').forEach(b=>b.addEventListener('click',()=>openEdit(b.dataset.id)))}
function metric(label,value,format){if(value===''||value==null)return '';return '<div class="metric"><small>'+esc(label)+'</small><strong>'+esc(format?format(value):value)+'</strong></div>'}
function card(w){const on=w.section==='on';const location=on&&w.location?'<div class="location-top">'+esc(w.location)+'</div>':'<div class="location-top"></div>';const ref=w.reference?'<span class="ref">Ref. '+esc(w.reference)+'</span>':'';const title=w.name?'<h3>'+esc(w.name)+'</h3>':'';const area=w.area?'<div class="area">'+esc(w.area)+'</div>':'';const tags=(w.vintage?'<span class="tag">'+esc(w.vintage)+'</span>':'')+(w.grapes?'<span class="tag">'+esc(w.grapes)+'</span>':'');const tasting=on&&w.tasting?'<div class="description">'+esc(w.tasting)+'</div>':'';const notes=w.notes?'<div class="description"><strong>Notas:</strong> '+esc(w.notes)+'</div>':'';const metrics=on?metric('Coste',w.cost,money)+metric('PVP',w.price,money)+metric('Beneficio',w.profit,money)+metric('Margen s/coste',w.marginCost,displayMargin)+metric('Margen s/venta',w.marginSale,displayMargin):metric('Coste',w.cost,money);const audit=(w.updatedBy||w.updatedAt)?'<span class="audit">'+esc([w.updatedBy,w.updatedAt].filter(Boolean).join(' · '))+'</span>':'<span></span>';return '<article class="card">'+location+'<div class="card-head">'+(w.type?'<span class="badge">'+esc(canonicalType(w.type))+'</span>':'<span></span>')+ref+'</div>'+title+area+(tags?'<div class="tags">'+tags+'</div>':'')+tasting+notes+(metrics?'<div class="money">'+metrics+'</div>':'')+'<div class="card-foot">'+audit+'<button class="edit" data-id="'+esc(w.id)+'">Editar</button></div></article>'}
function groupBy(arr,fn){return arr.reduce((a,x)=>((a[fn(x)]??=[]).push(x),a),{})}
function openNew(){state.editing=null;buildForm({section:state.section});$('#modalTitle').textContent='Nuevo vino';$('#saveBtn').textContent='Crear vino';$('#modal').showModal()}
function openEdit(id){const w=state.data[state.section].find(x=>x.id===id);if(!w)return;state.editing=w;buildForm(w);$('#modalTitle').textContent='Editar vino';$('#saveBtn').textContent='Guardar cambios';$('#modal').showModal()}
function buildForm(w){$('#modalEyebrow').textContent=state.section==='on'?'EN CARTA':'NO EN CARTA';$('#fields').innerHTML=schemas[state.section].map(([key,label,type,req,ro])=>{const full=type==='textarea'?' full':'';const attrs=(ro?' readonly class="readonly"':'')+(type==='number'?' step="0.01" min="0" inputmode="decimal"':'')+(key==='type'&&state.section==='on'?' list="typesOn"':'')+(key==='origin'?' list="countries"':'');const val=type==='number'?numeric(w[key]):w[key]||'';return '<div class="field'+full+'"><label for="f_'+key+'">'+esc(label)+'</label>'+(type==='textarea'?'<textarea id="f_'+key+'" name="'+key+'"'+attrs+'>'+esc(val)+'</textarea>':'<input id="f_'+key+'" name="'+key+'" type="'+type+'" value="'+esc(val)+'"'+attrs+'>')+'</div>'}).join('')}
function numeric(v){if(v==null||v==='')return '';let s=String(v).replace(/€/g,'').replace(/\s/g,'');if(s.includes(',')&&s.includes('.'))s=s.lastIndexOf(',')>s.lastIndexOf('.')?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');else s=s.replace(',','.');return s}
async function submit(e){e.preventDefault();const wine={};new FormData(e.currentTarget).forEach((v,k)=>wine[k]=v);const body=state.editing?{action:'save',section:state.section,row:state.editing.row,wine}:{action:'create',section:state.section,wine};$('#saveBtn').disabled=true;$('#saveBtn').textContent='Guardando…';try{const p=await api('POST',body);$('#modal').close();toast(p.message||'Cambios guardados');await load()}catch(err){toast(err.message,true)}finally{$('#saveBtn').disabled=false}}
function toast(msg,error=false){const el=$('#toast');el.textContent=msg;el.className='toast show'+(error?' error':'');clearTimeout(toast.t);toast.t=setTimeout(()=>el.className='toast',3500)}
function showError(msg){$('#content').className='empty';$('#content').innerHTML='<h3>No se pudo cargar la bodega</h3><p>'+esc(msg)+'</p>';toast(msg,true)}
$$('.tab').forEach(t=>t.addEventListener('click',()=>{$$('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');state.section=t.dataset.section;state.typeFilter='';$('#search').value='';render()}));
$('#search').addEventListener('input',render);$('#originFilter').addEventListener('change',render);$('#newBtn').addEventListener('click',openNew);$('#refreshBtn').addEventListener('click',load);$('#closeBtn').addEventListener('click',()=>$('#modal').close());$('#cancelBtn').addEventListener('click',()=>$('#modal').close());$('#wineForm').addEventListener('submit',submit);$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))$('#modal').close()});
function startSession(name){state.staff=name.trim();localStorage.setItem('wineStaffName',state.staff);$('#sessionName').textContent=state.staff;$('#app').hidden=false;if($('#loginModal').open)$('#loginModal').close();load()}
$('#loginForm').addEventListener('submit',e=>{e.preventDefault();const name=$('#staffInput').value.trim();if(!name){toast('Introduce tu nombre.',true);return}startSession(name)});
$('#logoutBtn').addEventListener('click',()=>{localStorage.removeItem('wineStaffName');state.staff='';$('#app').hidden=true;$('#staffInput').value='';$('#loginModal').showModal()});
const savedName=localStorage.getItem('wineStaffName');if(savedName)startSession(savedName);else $('#loginModal').showModal();
</script></body></html>
